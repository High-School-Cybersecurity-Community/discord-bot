name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions: {}

jobs:
    code:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  cache: true
                  install: true

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .content-collections/
                      dist/
                  key: build-cache-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}${{ github.run_attempt }}
                  restore-keys: build-cache-${{ github.repository }}-${{ github.ref_name }}-

            - run: pnpm build

            - parallel:
                  - run: pnpm lint
                  - run: pnpm fmt --check
                  - run: pnpm types
    zizmor:
        permissions:
            security-events: write
            contents: read
            actions: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
