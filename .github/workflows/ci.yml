name: CI

on:
    push:
    pull_request:

permissions: {}

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
              with:
                  cache: true
                  install: true

            - run: pnpm build
            - run: pnpm lint
            - run: pnpm fmt
            - run: pnpm types
